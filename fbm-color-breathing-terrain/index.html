<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERRA — FBM Breathing Terrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --breath: 12.566s; /* 2π / 0.5 rad·s⁻¹ — matches shader breath frequency */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #070d1c; }
  canvas { display: block; width: 100vw; height: 100vh; }

  .hud {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(1.2rem, 3vw, 2.4rem);
    color: rgba(235, 228, 214, 0.85);
    mix-blend-mode: screen;
  }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: clamp(1.6rem, 3.4vw, 2.6rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
  }
  h1 em { font-style: italic; letter-spacing: 0.12em; font-weight: 400; opacity: 0.75; }
  .meta {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: clamp(0.55rem, 1.1vw, 0.7rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    text-align: right;
    line-height: 1.9;
    opacity: 0.7;
  }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .breath {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 400;
    font-size: clamp(0.55rem, 1.1vw, 0.7rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 0.9em;
  }
  .breath .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(238, 178, 130, 0.9);
    animation: inhale var(--breath) ease-in-out infinite;
  }
  @keyframes inhale {
    0%, 100% { transform: scale(0.6); opacity: 0.45; }
    50%      { transform: scale(1.9); opacity: 1; }
  }
  .coords {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: clamp(0.55rem, 1.1vw, 0.7rem);
    letter-spacing: 0.28em;
    opacity: 0.55;
    text-align: right; line-height: 1.9;
  }
  @media (max-width: 640px) { .meta, .coords { display: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud">
  <div class="top">
    <h1>Terra <em>·&nbsp;respirare</em></h1>
    <div class="meta">
      fBm · 6 octaves<br>
      domain-warped · finite-diff normals
    </div>
  </div>
  <div class="bottom">
    <div class="breath"><span class="dot"></span> breath · 12.6 s</div>
    <div class="coords">elevation field<br>0x0F · A441</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false })
        || canvas.getContext('webgl', { antialias: false });

if (!gl) { document.body.innerHTML = '<p style="color:#cbb">WebGL unavailable.</p>'; throw new Error('no webgl'); }

const VERT = `#version 300 es
layout(location=0) in vec2 a;
void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const FRAG = `#version 300 es
precision highp float;

uniform vec2  u_res;
uniform float u_time;
out vec4 outColor;

/* ---------------- value noise + fbm ---------------- */
float hash(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash(i),               hash(i + vec2(1,0)), f.x),
    mix(hash(i + vec2(0,1)),   hash(i + vec2(1,1)), f.x),
    f.y);
}
const mat2 ROT = mat2(0.8, 0.6, -0.6, 0.8);
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 6; i++){
    v += a * noise(p);
    p  = ROT * p * 2.03;
    a *= 0.5;
  }
  return v;
}

/* ---------------- height field ---------------- */
float terrainHeight(vec2 uv, float t){
  float breath = sin(t * 0.5);                    // slow 12.6 s cycle
  vec2  p  = uv * 3.1;
  float tOff = t * 0.05;

  // double domain warp — folds the field into ridged complexity
  vec2 q = vec2(
    fbm(p + vec2(0.0, tOff)),
    fbm(p + vec2(5.2, 1.3) - tOff));
  vec2 r = vec2(
    fbm(p + 2.6*q + vec2(1.7, 9.2) + breath * 0.35),
    fbm(p + 2.6*q + vec2(8.3, 2.8) - breath * 0.35));
  float f = fbm(p + 2.1 * r);

  float h = f + 0.55 * dot(q, q);                // warp energy adds relief
  h = (h - 0.45) / 0.85;                          // normalize-ish

  // the breath: amplitude swell + gentle whole-field lift
  h *= 1.0 + 0.28 * breath;
  h += 0.10 * breath;
  return h;
}

/* ---------------- palette ---------------- */
vec3 palette(float h, float breath){
  // lows: indigo → deep teal | mids: emerald → sea-glass | highs: gold ↔ coral (drifts with breath)
  vec3 c1 = mix(vec3(0.020, 0.035, 0.105), vec3(0.016, 0.055, 0.095), 0.5 + 0.5*breath);
  vec3 c2 = vec3(0.045, 0.290, 0.335);
  vec3 c3 = mix(vec3(0.070, 0.500, 0.415), vec3(0.100, 0.560, 0.440), 0.5 + 0.5*breath);
  vec3 c4 = mix(vec3(0.940, 0.720, 0.360), vec3(0.930, 0.470, 0.380), 0.5 + 0.5*breath);
  vec3 c5 = vec3(0.985, 0.860, 0.780);

  vec3 col = c1;
  col = mix(col, c2, smoothstep(-0.25,  0.05, h));
  col = mix(col, c3, smoothstep( 0.05,  0.30, h));
  col = mix(col, c4, smoothstep( 0.30,  0.62, h));
  col = mix(col, c5, smoothstep( 0.62,  0.95, h));
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  float t = u_time;
  float breath = sin(t * 0.5);

  float h  = terrainHeight(uv, t);

  // finite-difference normal
  float e = 0.0035;
  float hx = terrainHeight(uv + vec2(e, 0.0), t);
  float hy = terrainHeight(uv + vec2(0.0, e), t);
  vec3 n = normalize(vec3((h - hx) / e, (h - hy) / e, 1.0));

  vec3 col = palette(h, breath);

  // light — drifts ever so slightly over time, warm key
  vec3 L = normalize(vec3(-0.35 + 0.10*sin(t*0.11), 0.55 + 0.10*cos(t*0.09), 0.75));
  float diff = clamp(dot(n, L), 0.0, 1.0);
  float amb  = 0.34 + 0.06 * breath;

  // warm key vs cool fill
  vec3 warmKey  = vec3(1.05, 0.92, 0.78);
  vec3 coolFill = vec3(0.45, 0.58, 0.80);
  vec3 lit = col * (amb + diff * diff * 0.95 * warmKey);
  lit += col * coolFill * 0.22 * clamp(-n.y, 0.0, 1.0);

  // crisp warm specular on ridges
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float spec = pow(clamp(dot(n, H), 0.0, 1.0), 48.0);
  lit += spec * vec3(1.0, 0.85, 0.65) * (0.35 + 0.30 * breath);

  // breathing halo on the highest crests — subtle, synced
  lit += smoothstep(0.55, 0.95, h) * vec3(1.0, 0.55, 0.42) * (0.10 + 0.12 * breath);

  // depth fog toward the frame edges, tinted by breath
  float fog = smoothstep(0.35, 1.25, length(uv) - 0.25 * h);
  vec3 fogCol = mix(vec3(0.015, 0.030, 0.070), vec3(0.020, 0.045, 0.065), 0.5 + 0.5*breath);
  lit = mix(lit, fogCol, fog * 0.9);

  // vignette
  lit *= 1.0 - 0.35 * smoothstep(0.55, 1.35, length(uv));

  // fine grain to kill banding
  float g = hash(gl_FragCoord.xy + fract(t) * 61.7);
  lit += (g - 0.5) * 0.025;

  // gentle tonemap
  lit = lit / (1.0 + lit * 0.35);
  lit = pow(clamp(lit, 0.0, 1.0), vec3(0.94));

  outColor = vec4(lit, 1.0);
}
`;

function makeShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const isGL2 = !!gl.getExtension || (gl instanceof WebGL2RenderingContext);
let vertSrc = VERT, fragSrc = FRAG;
if (!isGL2) {
  vertSrc = 'attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }';
  fragSrc = FRAG.replace('#version 300 es', '')
                .replace('out vec4 outColor;', 'precision highp float;')
                .replace('outColor =', 'gl_FragColor =');
}

const prog = gl.createProgram();
gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, vertSrc));
gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, fragSrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

// full-screen triangle
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aLoc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(aLoc);
gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);

const uRes  = gl.getUniformLocation(prog, 'u_res');
const uTime = gl.getUniformLocation(prog, 'u_time');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth  * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
window.addEventListener('resize', resize);
resize();

const t0 = performance.now();
function frame() {
  resize();
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, (performance.now() - t0) * 0.001);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
